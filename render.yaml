# Render Blueprint: the whole stack in one click (Dashboard > New > Blueprint).
# API (FastAPI + MCP), web (Next.js), Postgres, a Cron Job that runs the money clock,
# and a Workflow that sends settle-up invoices in parallel.

services:
  - type: web
    name: sidequest-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps paypal-agent-toolkit==1.11.0
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: sidequest-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: DEMO_CARD_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Render Workflows: settle up sends each invoice as its own task run. Create an API key in
      # Account Settings > API Keys. Without it, invoices are sent from the API instead.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          name: sidequest-settle
          type: workflow
          property: slug

  - type: web
    name: sidequest-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # Holds expire and deadlines pass whether or not anyone is on the site. Every 30 minutes this
  # tips or cancels quests at their deadline, locks fares, and releases escrowed host payouts.
  # It calls the public URL because free web services can't receive private network traffic.
  - type: cron
    name: sidequest-clock
    runtime: python
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: "true"
    startCommand: python scripts/tick.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          name: sidequest-api
          type: web
          envVarKey: CRON_SECRET

  # Settle up on Render Workflows: one send_invoice task per person, each on its own instance with
  # retries. Invoice numbers are deterministic, so a retry can't bill anyone twice.
  - type: workflow
    name: sidequest-settle
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install --no-deps paypal-agent-toolkit==1.11.0
    startCommand: python workflows.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_CLIENT_ID
        fromService:
          name: sidequest-api
          type: web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          name: sidequest-api
          type: web
          envVarKey: PAYPAL_CLIENT_SECRET

databases:
  # Smallest paid plan. Free Render Postgres expires 30 days after creation, which would land
  # inside the Dec 1-15 judging window.
  - name: sidequest-db
    plan: 0.1c-256mb
    databaseName: sidequest
    user: sidequest
    ipAllowList: []  # private network only; the API connects over Render's internal URL
